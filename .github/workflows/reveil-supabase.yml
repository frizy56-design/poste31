# Envoie une petite requête à la base chaque jour pour que Supabase
# ne mette pas le projet gratuit en veille (il le fait après une semaine sans activité).
name: Réveil Supabase

on:
  schedule:
    - cron: '23 5 * * *'   # tous les jours tôt le matin
  workflow_dispatch:        # bouton « Run workflow » pour tester à la main

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petite requête à la base
        env:
          CONFIG_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/config.js
        run: |
          curl -fsSL "$CONFIG_URL" -o config.js
          URL=$(grep -oP "supabaseUrl\s*:\s*['\"]\K[^'\"]*" config.js | head -n1 | sed 's:/*$::')
          KEY=$(grep -oP "supabaseKey\s*:\s*['\"]\K[^'\"]*" config.js | head -n1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js n'est pas encore rempli : rien à réveiller."
            exit 0
          fi
          AUTH=()
          case "$KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $KEY") ;; esac
          curl -fsS -X POST "$URL/rest/v1/rpc/p31_question" \
            -H "apikey: $KEY" "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d '{"p_username":"reveil"}'
          echo
          echo "Base réveillée."
